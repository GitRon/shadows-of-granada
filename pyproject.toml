[project]
name = "shadows-of-granada"
version = "0.1.0"
description = "Reconquista – cooperative card game print assets"
requires-python = ">=3.14"
dependencies = ["jinja2>=3.1"]

[project.scripts]
render-cards = "shadows_of_granada.render:main"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
