<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: white; width: 210mm; margin: 0 auto; padding: 10mm; }
  h1 { font-size: 14pt; text-align: center; color: #3b2a1a; margin-bottom: 1mm; }
  .sub { font-size: 8pt; text-align: center; color: #7a5c3a; margin-bottom: 5mm; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; }
  .card { border-radius: 4px; overflow: hidden; border: 2px solid; background: white; height: 54mm; display: flex; flex-direction: column; page-break-inside: avoid; }
  .hdr { padding: 2mm 3mm; display: flex; align-items: center; gap: 2mm; }
  .hdr .em { font-size: 15pt; line-height: 1; }
  .hdr .nm { color: white; font-weight: bold; font-size: 8.5pt; line-height: 1.2; }
  .action { padding: 2mm 3mm; flex: 1; border-bottom: 1px dashed #c0a880; }
  .action .lbl { font-size: 6.5pt; color: #9a7a5a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1mm; }
  .action .txt { font-size: 7.5pt; color: #1a1a1a; line-height: 1.35; }
  .boost { padding: 2mm 3mm; }
  .boost .lbl { font-size: 6.5pt; color: #9a7a5a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1mm; }
  .boost .sym { font-size: 13pt; line-height: 1; }
  @media print { body { padding: 8mm; } .grid { gap: 2mm; } }
</style>
</head>
<body>
<h1>RECONQUISTA – Aktionskarten</h1>
<p class="sub">24 Karten · 4 pro Symbol · Ausschneiden an den Rändern</p>

<div class="grid" id="cards"></div>

<script>
const cards = [
  { symbol:"⚔️", name:"Feldzug",         action:"Setze alle ⚔️ dieses Stapels ein.",                                              boost:"⚔️",    color:"#8b2020" },
  { symbol:"⚔️", name:"Belagerung",       action:"Setze alle ⚔️🏰 dieses Stapels + 1 🏰 ein.",                                    boost:"⚔️ 🏰", color:"#8b2020" },
  { symbol:"⚔️", name:"Söldner",          action:"Setze alle ⚔️ dieses Stapels + 1 💰 ein. 💰 zählen als ⚔️.",                   boost:"⚔️",    color:"#8b2020" },
  { symbol:"⚔️", name:"Grenzkampf",       action:"Setze alle ⚔️ dieses Stapels + 1 ✝️ ein. Verhindere eine Eskalation.",          boost:"⚔️ ✝️", color:"#8b2020" },
  { symbol:"✝️", name:"Kreuzzugsbulle",   action:"Setze alle ✝️ dieses Stapels ein.",                                              boost:"✝️",    color:"#5a3e8a" },
  { symbol:"✝️", name:"Kirchensegen",     action:"Setze alle ✝️👑 dieses Stapels + 1 👑 ein. Ein Mitspieler legt eine Karte neu ab.", boost:"✝️ 👑", color:"#5a3e8a" },
  { symbol:"✝️", name:"Pilgerweg",        action:"Setze alle ✝️🌾 dieses Stapels + 1 🌾 ein.",                                    boost:"✝️ 🌾", color:"#5a3e8a" },
  { symbol:"✝️", name:"Bischofsrat",      action:"Setze alle ✝️ dieses Stapels + 1 ✝️ ein. Schau die oberste Krisenkarte an.",    boost:"✝️ 👑", color:"#5a3e8a" },
  { symbol:"👑", name:"Heiratsvertrag",   action:"Setze alle 👑 dieses Stapels ein.",                                              boost:"👑",    color:"#b8860b" },
  { symbol:"👑", name:"Friedensabkommen", action:"Setze alle 👑💰 dieses Stapels + 1 💰 ein. Verzögere eine Krise um 1 Runde.",   boost:"👑 💰", color:"#b8860b" },
  { symbol:"👑", name:"Allianz",          action:"Setze alle 👑 dieses Stapels + 1 ✝️ ein. Ein Mitspieler darf eine zweite Karte spielen.", boost:"👑", color:"#b8860b" },
  { symbol:"👑", name:"Erbfolge",         action:"Setze alle 👑🌾 dieses Stapels + 1 👑 ein. Ziehe 1 Karte extra.",               boost:"👑 🌾", color:"#b8860b" },
  { symbol:"💰", name:"Tributzahlung",    action:"Setze alle 💰 dieses Stapels ein.",                                              boost:"💰",    color:"#2e6b3e" },
  { symbol:"💰", name:"Handelsroute",     action:"Setze alle 💰🌾 dieses Stapels + 1 🌾 ein. Lege eine Karte offen auf anderen Slot.", boost:"💰 🌾", color:"#2e6b3e" },
  { symbol:"💰", name:"Söldnerwerbung",   action:"Setze alle 💰 dieses Stapels + 1 ⚔️ ein. 💰 zählen als ⚔️.",                  boost:"💰",    color:"#2e6b3e" },
  { symbol:"💰", name:"Marktrechte",      action:"Setze alle 💰👑 dieses Stapels + 1 👑 ein. Ein Mitspieler darf eine Karte tauschen.", boost:"💰 👑", color:"#2e6b3e" },
  { symbol:"🏰", name:"Burgbau",          action:"Setze alle 🏰 dieses Stapels ein.",                                              boost:"🏰",    color:"#3a5a8a" },
  { symbol:"🏰", name:"Grenzfestung",     action:"Setze alle 🏰⚔️ dieses Stapels + 1 ⚔️ ein. Schütze eine Region vor Eskalation.", boost:"🏰 ⚔️", color:"#3a5a8a" },
  { symbol:"🏰", name:"Ritterorden",      action:"Setze alle 🏰✝️ dieses Stapels + 1 ✝️ ein.",                                   boost:"🏰 ✝️", color:"#3a5a8a" },
  { symbol:"🏰", name:"Zufluchtsort",     action:"Setze alle 🏰🌾 dieses Stapels + 1 🌾 ein. Verhindere Kartenverlust durch Krisen.", boost:"🏰 🌾", color:"#3a5a8a" },
  { symbol:"🌾", name:"Stadtgründung",    action:"Setze alle 🌾 dieses Stapels ein.",                                              boost:"🌾",    color:"#7a6030" },
  { symbol:"🌾", name:"Fuero",            action:"Setze alle 🌾👑 dieses Stapels + 1 👑 ein. Stabilisiere eine Region dauerhaft.", boost:"🌾 👑", color:"#7a6030" },
  { symbol:"🌾", name:"Ernte",            action:"Setze alle 🌾💰 dieses Stapels + 1 💰 ein.",                                   boost:"🌾 💰", color:"#7a6030" },
  { symbol:"🌾", name:"Klostergründung",  action:"Setze alle 🌾✝️ dieses Stapels + 1 ✝️ ein. Stabilisiere den ✝️-Slot einer Region.", boost:"🌾 ✝️", color:"#7a6030" },
];

const grid = document.getElementById("cards");
cards.forEach(c => {
  grid.innerHTML += `
    <div class="card" style="border-color:${c.color}">
      <div class="hdr" style="background:${c.color}">
        <span class="em">${c.symbol}</span>
        <span class="nm">${c.name}</span>
      </div>
      <div class="action">
        <div class="lbl">Aktion</div>
        <div class="txt">${c.action}</div>
      </div>
      <div class="boost">
        <div class="lbl">Verstärkung (unten)</div>
        <div class="sym">${c.boost}</div>
      </div>
    </div>`;
});
</script>
</body>
</html>
